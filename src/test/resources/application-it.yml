spring:
  application:
    version: 0.0.1-TEST
  kafka:
    consumer:
      group-id: it-test-mod-users-keycloak-group
  datasource:
    username: folio_admin
    password: qwerty123
    hikari:
      data-source-properties:
        preparedStatementCacheQueries: 0
  jpa:
    show-sql: true

application:
  environment: it-test
  migration:
    batch-size: 30 # Increase the batch size to ease mocking
  keycloak:
    tls:
      enabled: true
      trust-store-path: classpath:certificates/test.truststore.jks
      trust-store-password: secretpassword
      trust-store-type: JKS
  secret-store:
    type: EPHEMERAL
    environment: it-test
    ephemeral:
      content:
        it-test_master_folio-backend-admin-client: ${KC_ADMIN_CLIENT_SECRET}
  retry:
    system-user-capabilities:
      retry-attempts: 2
      retry-delay: 50ms
  federated-auth:
    enabled: ${SINGLE_TENANT_UX:false}
    identity_provider_suffix: ${IDENTITY_PROVIDER_SUFFIX:-keycloak-oidc}
  kafka:
    consumer:
      filtering:
        tenant-filter:
          enabled: false

header:
  validation:
    x-okapi-user-id:
      exclude:
        base-paths: /tests, /admin
